<div class="global-total">
  <div class="week-progress-container">
    <h2>Week Progress</h2>

    <mat-progress-bar mode="determinate" [value]="weekProgressPercentage">
    </mat-progress-bar>
    <div class="progress-label">
      {{ weekProgressPercentage }}% of the week passed
    </div>
  </div>
  <mat-card>
    <strong>Weekly Result: {{ calculateGlobalPercentage() }}%</strong>
  </mat-card>
  <div class="progress-bar">
    <mat-progress-bar
      [value]="calculateGlobalPercentage()"
      [color]="getProgressBarColor(calculateGlobalPercentage())"
      [ngClass]="{
        'custom-progress-bar': calculateGlobalPercentage() >= SUCCESS_RATE,
      }"
      mode="determinate"
    ></mat-progress-bar>
  </div>

  <div *ngIf="showStars" class="stars-container">
    <div
      *ngFor="let position of starPositions"
      class="gold-star"
      [ngStyle]="{
        top: position.top,
        left: position.left,
        'font-size': position.size,
        'animation-duration': position.rotationSpeed + 's',
      }"
    >
      &#9733;
    </div>
  </div>

  <div class="action-buttons">
    <button mat-raised-button color="primary" (click)="clearForm()">
      Clear
    </button>
    <button mat-raised-button color="accent" (click)="copyToClipboard()">
      Copy
    </button>
    @if (clipboardText) {
      <span class="clipboardText">{{ clipboardText }}</span>
    }
  </div>

  <form [formGroup]="form">
    <div
      formArrayName="items"
      *ngFor="let itemGroup of items.controls; let i = index"
    >
      <div [formGroupName]="i" class="item">
        <mat-card>
          <mat-card-header>
            <mat-card-title>{{ itemGroup.get('name')?.value }}</mat-card-title>
          </mat-card-header>

          <mat-card-content>
            <div>
              Total Percentage:
              <strong>{{ calculateParentPercentage(i) }}%</strong>
              <div class="progress-bar">
                <mat-progress-bar
                  [value]="calculateParentPercentage(i)"
                  [color]="getProgressBarColor(calculateParentPercentage(i))"
                  [ngClass]="{
                    'custom-progress-bar':
                      calculateParentPercentage(i) >= SUCCESS_RATE,
                  }"
                ></mat-progress-bar>
              </div>
            </div>
            <div
              formArrayName="subItems"
              *ngFor="
                let subItemGroup of getSubItems(i).controls;
                let j = index
              "
            >
              <div [formGroupName]="j" class="subitem">
                <mat-checkbox
                  formControlName="included"
                  (change)="updateParentPercentage(i, j)"
                >
                  {{ subItemGroup.get('name')?.value }}
                </mat-checkbox>

                <button
                  class="badge"
                  mat-mini-fab
                  color="primary"
                  (click)="toggleBadge(i, j)"
                  [matBadge]="isBadgeVisible(i, j) ? '★' : ''"
                  matBadgeColor="accent"
                  matBadgePosition="above after"
                  matBadgeOverlap="false"
                >
                  +
                </button>
              </div>
            </div>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </form>
</div>
