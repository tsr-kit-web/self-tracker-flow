<h2 mat-dialog-title>Edit Text</h2>
<mat-dialog-content>
  <mat-form-field appearance="fill">
    <mat-label>Text</mat-label>
    <textarea matInput [(ngModel)]="text" rows="5"></textarea>
  </mat-form-field>
</mat-dialog-content>

<mat-dialog-actions>
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-button (click)="onSave()">Save</button>
</mat-dialog-actions>
